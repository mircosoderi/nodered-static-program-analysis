/*
  uRDF Sidebar (Node-RED Editor Plugin)

  This file registers a Node-RED sidebar tab that acts as a lightweight “control panel”
  for the uRDF runtime plugin. It is entirely client-side and runs inside the Node-RED editor.

  What it does:
  - Calls the runtime HTTP Admin API endpoints (e.g., /urdf/health, /urdf/query, /urdf/loadFile)
  - Subscribes to server-published events on RED.comms (topic: "urdf/events")
  - Provides simple UIs for: ping/load/search/query/export/clear + rule CRUD + reasoning view

  Important separation of concerns:
  - This sidebar never performs reasoning itself.
  - It only sends requests to the runtime and renders the responses/events.
*/
(function () {
  "use strict";

  
  /*
    RED.comms topic used by the runtime to push structured events to the editor.
    The runtime publishes objects that include request/response metadata, used here
    to populate the Response panel and the Events log.
  */
const TOPIC = "urdf/events";


  
  /*
    createSidebar() builds the entire sidebar UI and registers it as a Node-RED tab.
    It returns small helpers used by the plugin lifecycle (appendLog, setResponse, ...).
  */

        .attr("placeholder", ph)

          minHeight: minH || "110px",
          fontFamily: "monospace",

      const $r = $("<div>").css({ display: "flex", gap: "8px", alignItems: "center" });
      elts.forEach(e => $r.append(e));
      return $r;

    function mkTitle(t) {
      return $("<div>").css({ fontWeight: 600 }).text(t);
    }

    function setVisible($el, on) {
      $el.css("display", on ? "" : "none");
    }

    function firstLiteral(node, iri) {
  const arr = node && node[iri];
  if (!Array.isArray(arr) || arr.length === 0) return "";
  const v = arr[0];
  return (v && typeof v === "object" && v["@value"] !== undefined) ? String(v["@value"]) : "";
}

function setLiteral(node, iri, value) {
  if (value === undefined || value === null || String(value).trim() === "") {
    delete node[iri];
    return;
  }
  node[iri] = [{ "@value": value }];
}

function isRule(node) {
  const t = node && node["@type"];
  const types = Array.isArray(t) ? t : (t ? [t] : []);
  return types.includes(IRI_NRUA_RULE);
}

function isNodeUrn(subjectIri) {
  return typeof subjectIri === "string" && subjectIri.startsWith("urn:nrua:n");
}

function nodeIdFromUrn(subjectIri) {
  return subjectIri.slice("urn:nrua:n".length);
}

function revealNodeInEditor(nodeId) {
  try {
    if (RED && RED.view && typeof RED.view.reveal === "function") {
      RED.view.reveal(nodeId);
      return true;
    }
  } catch (_) {}
  return false;
}

function termValue(t) {
  return t && typeof t === "object" ? t.value : undefined;
}

function ratingToNumber(r) {
  if (!r) return -1;
  const m = /(\d+)\s*$/.exec(String(r));
  return m ? parseInt(m[1], 10) : -1;
}

function dateToMs(d) {
  if (!d) return 0;
  const ms = Date.parse(String(d));
  return Number.isFinite(ms) ? ms : 0;
}

function isFlowUrn(subjectIri) {
  return typeof subjectIri === "string" && subjectIri.startsWith("urn:nrua:f");
}

function flowIdFromUrn(subjectIri) {
  return subjectIri.slice("urn:nrua:f".length);
}

function revealFlowInEditor(flowId) {
  try {
    if (RED && RED.workspaces && typeof RED.workspaces.show === "function") {
      RED.workspaces.show(flowId);
      return true;
    }
  } catch (_) {}
  return false;
}

function localIdFromIri(iri) {
  if (!iri) return "";
  const s = String(iri);
  const m = /([^/#:]+)\s*$/.exec(s);
  return m ? m[1] : s;
}

function humanPredicateLabel(pIri, pLabel) {
  const lbl = (pLabel || "").trim();
  if (lbl) return lbl;
  return localIdFromIri(pIri);
}


function htmlEscape(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function formatLabel(value) {
  return String(value || "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, function (m) { return m.toUpperCase(); });
}

function uniqueSorted(values) {
  return Array.from(new Set((values || []).filter(function (value) {
    return value != null && String(value).trim() !== "";
  }).map(function (value) {
    return String(value).trim();
  }))).sort(function (a, b) {
    return a.localeCompare(b, undefined, { sensitivity: "base" });
  });
}

function getWorkspaceLabel(ws) {
  if (!ws) return "";
  return String(ws.label || ws.name || ws.id || "").trim();
}

function collectApplicationNodeNames() {
  const names = [];
  try {
    if (RED && RED.nodes && typeof RED.nodes.eachNode === "function") {
      RED.nodes.eachNode(function (node) {
        if (node && node.name != null && String(node.name).trim() !== "") {
          names.push(String(node.name).trim());
        }
      });
    }
  } catch (_) {}
  return uniqueSorted(names);
}

function collectApplicationFlowNames() {
  const names = [];
  try {
    if (RED && RED.nodes) {
      if (typeof RED.nodes.eachWorkspace === "function") {
        RED.nodes.eachWorkspace(function (ws) {
          const label = getWorkspaceLabel(ws);
          if (label) names.push(label);
        });
      } else if (RED.nodes.workspaces && typeof RED.nodes.workspaces.each === "function") {
        RED.nodes.workspaces.each(function (ws) {
          const label = getWorkspaceLabel(ws);
          if (label) names.push(label);
        });
      } else if (typeof RED.nodes.eachNode === "function") {
        const seen = new Set();
        RED.nodes.eachNode(function (node) {
          const z = node && node.z;
          if (!z || seen.has(z)) return;
          seen.add(z);
          if (typeof RED.nodes.workspace === "function") {
            const ws = RED.nodes.workspace(z);
            const label = getWorkspaceLabel(ws);
            if (label) names.push(label);
          }
        });
      }
    }
  } catch (_) {}
  return uniqueSorted(names);
}

async function loadRulesDoc() {
  const adminRoot = (RED.settings.httpAdminRoot || "").replace(/\/$/, "");
  const url = adminRoot + "/urdf/export?gid=" + encodeURIComponent(RULES_GID);

  const r = await fetch(url, { method: "GET" });

  if (r.status === 404) {
    return { "@id": RULES_GID, "@graph": [] };
  }
  if (!r.ok) {
    const text = await r.text().catch(() => "");
    throw new Error(`Failed to export rules: HTTP ${r.status} ${text.slice(0, 200)}`);
  }
  return await r.json();
}

async function renderRules() {
  $rulesList.empty();

  const doc = await loadRulesDoc();
  const graph = Array.isArray(doc["@graph"]) ? doc["@graph"] : [];
  const rules = graph.filter(isRule);

	const nodesById = new Map();
for (const n of graph) {
  if (n && n["@id"]) nodesById.set(n["@id"], n);
}

  if (rules.length === 0) {
    $rulesList.append($("<div>").text("No rules found."));
    return;
  }

  rules.forEach((rule) => {
    const rid = rule["@id"] || "(no @id)";
    const name = firstLiteral(rule, IRI_SCHEMA_NAME) || rid;
    const desc = firstLiteral(rule, IRI_SCHEMA_DESC);
    const query = firstLiteral(rule, IRI_SCHEMA_TEXT);

    const $card = $("<div>").css({
      border: "1px solid var(--red-ui-primary-border-color, #ddd)",
      borderRadius: "4px",
      padding: "8px",
      display: "flex",
      flexDirection: "column",
      gap: "6px"
    });

    const $hdr = $("<div>").css({ display: "flex", justifyContent: "space-between", gap: "8px", alignItems: "center" });
    const $left = $("<div>");
    $left.append(
      $("<div>").css({ fontWeight: 600 }).text(name),
      $("<div>").css({ fontFamily: "monospace", fontSize: "11px", opacity: 0.8 }).text(rid)
    );

    const $btnSave = $("<button>").addClass("red-ui-button red-ui-button-small").text("Save");
    const $btnDelete = $("<button>").addClass("red-ui-button red-ui-button-small").text("Delete");
    const $right = $("<div>").css({ display: "flex", gap: "8px" }).append($btnSave, $btnDelete);

    $hdr.append($left, $right);

    const $progLang = firstLiteral(rule, IRI_SCHEMA_PROG_LANG) || "SPARQL";
    const $encoding = firstLiteral(rule, IRI_SCHEMA_ENCODING) || "application/sparql-query";
    const $nameInput = mkInput("Rule name").val(name);
    const $descInput = mkInput("Description (optional)").val(desc);
    const $progLangInput = mkInput("Programming language").val($progLang);
    const $encodingInput = mkInput("Encoding").val($encoding);
    const $queryArea = mkTextArea("SPARQL", "140px").val(query);

function deref(nodeOrRef) {
  if (!nodeOrRef) return null;
  if (typeof nodeOrRef === "string") return nodesById.get(nodeOrRef) || null;
  if (nodeOrRef["@id"]) return nodesById.get(nodeOrRef["@id"]) || nodeOrRef; // fallback
  return nodeOrRef;
}

function getFirstHasPartText(ruleObj) {
  const parts = ruleObj[IRI_SCHEMA_HAS_PART] || [];
  const arr = Array.isArray(parts) ? parts : [parts];
  for (const partRef of arr) {
    const part = deref(partRef);
    if (!part) continue;
    const t = firstLiteral(part, IRI_SCHEMA_TEXT);
    if (t) return t;
  }
  return "";
}

const projectionText = getFirstHasPartText(rule);
const $projHint = $("<div>")
  .css({ "margin": "6px 0 2px 0", "font-size": "11px", "opacity": 0.75 })
  .text("Projection SPARQL (only applies to N3 rules):");

}

    $rulesList.append($card);

    $btnSave.on("click", async () => {
      try {
        const updated = JSON.parse(JSON.stringify(rule)); // shallow clone safe enough for this structure
        setLiteral(updated, IRI_SCHEMA_NAME, ($nameInput.val() || "").trim());
        setLiteral(updated, IRI_SCHEMA_DESC, ($descInput.val() || "").trim());
        setLiteral(updated, IRI_SCHEMA_TEXT, ($queryArea.val() || "").trim());
        setLiteral(updated, IRI_SCHEMA_PROG_LANG, ($progLangInput.val() || "").trim());
        setLiteral(updated, IRI_SCHEMA_ENCODING, ($encodingInput.val() || "").trim());

	      const lang = ($progLangInput.val() || "").trim().toUpperCase();
if (lang === "N3") {
  const proj = ($projArea.val() || "").trim();

  updated[IRI_SCHEMA_HAS_PART] = [{
    "@type": "https://schema.org/SoftwareSourceCode",
    [IRI_SCHEMA_PROG_LANG]: "SPARQL",
    [IRI_SCHEMA_ENCODING]: "application/sparql-query",
    [IRI_SCHEMA_TEXT]: proj
  }];
} else {
  delete updated[IRI_SCHEMA_HAS_PART];
}


        const { status, json } = await doFetchJson("urdf/rules/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rule: updated })
        });

        setResponse(json);
        appendLog(`HTTP ${status} POST /urdf/rules/update ${rid}`);

        if (status >= 200 && status < 300 && json && json.ok) {
          await renderRules();
        }
      } catch (e) {
        setResponse({ ok: false, error: String(e) });
        appendLog("ERROR updating rule: " + String(e));
      }
    });

    $btnDelete.on("click", async () => {
      try {
        const { status, json } = await doFetchJson("urdf/rules/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: rid })
        });

        setResponse(json);
        appendLog(`HTTP ${status} POST /urdf/rules/delete ${rid}`);

        if (status >= 200 && status < 300 && json && json.ok) {
          await renderRules();
        }
      } catch (e) {
        setResponse({ ok: false, error: String(e) });
        appendLog("ERROR deleting rule: " + String(e));
      }
    });
  });
}

});

function fmtMs(x) {
  if (x === undefined || x === null || !Number.isFinite(Number(x))) return "—";
  const v = Number(x);
  return (v < 1000) ? v.toFixed(2) + " ms" : (v/1000).toFixed(2) + " s";
}
function fmtInt(x) {
  if (x === undefined || x === null || !Number.isFinite(Number(x))) return "—";
  return String(Math.trunc(Number(x)));
}

function upsertCycleEvent(ev) {
  const id = ev.cycleId;
  if (!id) return;

  let rec = metricsState.byId.get(id);
  if (!rec) {
    rec = { cycleId: id, ts: ev.ts || Date.now(), triggerReason: ev.triggerReason || "", cycle: null, rules: [] };
    metricsState.byId.set(id, rec);
    metricsState.cycles.unshift(rec);

    // bound size
    while (metricsState.cycles.length > METRICS_MAX_CYCLES) {
      const last = metricsState.cycles.pop();
      if (last) metricsState.byId.delete(last.cycleId);
    }
  }
  // update ts/triggerReason if newer
  if (ev.ts && ev.ts > rec.ts) rec.ts = ev.ts;
  if (ev.triggerReason) rec.triggerReason = ev.triggerReason;

  if (ev.kind === "cycle") rec.cycle = ev;
  if (ev.kind === "rule") rec.rules.push(ev);
}

function recomputeSummary() {
  const n = metricsState.cycles.length;
  if (n === 0) return "No metrics yet.";

  // Use only cycles that have a cycle record
  const cyclesWith = metricsState.cycles.filter(c => c.cycle && Number.isFinite(Number(c.cycle.t_reload_ms)));
  const m = cyclesWith.length;
  if (m === 0) return `Captured ${n} cycle(s), waiting for cycle summaries...`;

  const reloads = cyclesWith.map(c => Number(c.cycle.t_reload_ms)).sort((a,b)=>a-b);
  const p50 = reloads[Math.floor(0.50*(m-1))];
  const p95 = reloads[Math.floor(0.95*(m-1))];
  const max = reloads[m-1];

  const last = cyclesWith[0].cycle;

  return [
    `cycles: ${m} (stored: ${n})`,
    `t_reload_ms: p50=${fmtMs(p50)}  p95=${fmtMs(p95)}  max=${fmtMs(max)}`,
    `last: reason=${last.triggerReason || ""}  inferred=${fmtInt(last.size_inferred)}  total=${fmtInt(last.total_size)}`
  ].join("\n");
}

function renderCyclesList() {
  $monSummary.text(recomputeSummary());
  $monCycles.empty();

  const list = metricsState.cycles.slice(0, 50); // show last 50
  if (list.length === 0) {
    $monCycles.append($("<div>").text("No cycles."));
    return;
  }

  list.forEach(rec => {
    const c = rec.cycle;
    const title = `${new Date(rec.ts).toISOString()}  ${rec.triggerReason || ""}  ${rec.cycleId}`;
    const line2 = c
      ? `t_reload=${fmtMs(c.t_reload_ms)}  clear=${fmtMs(c.t_clear_inferred_ms)}  load=${fmtMs(c.t_load_inferred_ms)}  inferred=${fmtInt(c.size_inferred)}`
      : `t_reload=— (waiting)  rules=${rec.rules.length}`;

    const $card = $("<div>").css({
      border: "1px solid var(--red-ui-primary-border-color, #ddd)",
      borderRadius: "4px",
      padding: "6px 8px",
      cursor: "pointer"
    });

    $card.append(
      $("<div>").css({ fontWeight: 600, fontFamily: "monospace", fontSize: "12px" }).text(title),
      $("<div>").css({ fontFamily: "monospace", fontSize: "12px", opacity: 0.85 }).text(line2)
    );

    $card.on("click", () => renderCycleDetails(rec.cycleId));
    $monCycles.append($card);
  });
}

function renderCycleDetails(cycleId) {
  const rec = metricsState.byId.get(cycleId);
  if (!rec) {
    $monDetails.text("Cycle not found.");
    return;
  }

  const c = rec.cycle || {};
  const rules = rec.rules || [];
  // compute totals
  const totalRuleMs = rules.reduce((acc,r)=>acc + (Number(r.t_rule_ms)||0), 0);

  // simple per-rule lines
  const ruleLines = rules.map(r => {
    if (r.ruleKind === "sparql+n3") {
      return [
        `- [${r.ruleId || "?"}] ${r.ruleKind}`,
        `  t_rule=${fmtMs(r.t_rule_ms)}  proj=${fmtMs(r.t_proj_sparql_ms)}  eye=${fmtMs(r.t_eye_ms)}  facts_in=${fmtInt(r.n_facts_in)}  derived_out=${fmtInt(r.n_derived_out)}`
      ].join("\n");
    }
    return `- [${r.ruleId || "?"}] ${r.ruleKind}  t_rule=${fmtMs(r.t_rule_ms)}  n_bindings_spo=${fmtInt(r.n_bindings_spo)}`;
  });

  const header = [
    `cycleId: ${rec.cycleId}`,
    `ts: ${new Date(rec.ts).toISOString()}`,
    `reason: ${rec.triggerReason || ""}`,
    c.t_reload_ms !== undefined ? `t_reload: ${fmtMs(c.t_reload_ms)} (rules total: ${fmtMs(totalRuleMs)})` : `t_reload: —`,
    c.t_clear_inferred_ms !== undefined ? `clear: ${fmtMs(c.t_clear_inferred_ms)}  load: ${fmtMs(c.t_load_inferred_ms)}` : `clear/load: —`,
    c.size_inferred !== undefined ? `size_inferred: ${fmtInt(c.size_inferred)}  total_size: ${fmtInt(c.total_size)}` : `sizes: —`,
    `rules: ${rules.length}`
  ].join("\n");

  $monDetails.text(header + "\n\n" + (ruleLines.join("\n") || "(no rule metrics)"));
}

async function loadReasoningResults() {
const sparql = `
SELECT
  ?s ?p ?doc
  ?sClass ?sClassLabel 
  ?pLabel
  ?title ?url ?site ?date ?rating ?cat
WHERE {
  # 1) Reasoning links: ONLY from inferred graph
  GRAPH <urn:graph:inferred> {
    ?s ?p ?doc .
  }

  # 2) Subject type is in the app graph
  OPTIONAL {
    GRAPH <urn:nrua:app> {
      ?s a ?sClass .
    }
  }

  # 4) Predicate label (best-effort)
  OPTIONAL {
    GRAPH <urn:nrua:ontology> {
      ?p <http://www.w3.org/2000/01/rdf-schema#label> ?pLabel .
    }
  }
  OPTIONAL {
    GRAPH <urn:nrua:ontology> {
      ?p <https://schema.org/name> ?pLabel .
    }
  }
  # 5) Document metadata: doc MAY be in one of these graphs (or none / literal)
  OPTIONAL {
    {
      GRAPH <urn:graph:issues> {
        ?doc <https://schema.org/url> ?url .
        OPTIONAL { ?doc <https://schema.org/title> ?title . }
        OPTIONAL { ?doc <https://schema.org/date> ?date . }
        OPTIONAL { ?doc <https://schema.org/contentRating> ?rating . }
        OPTIONAL { ?doc <https://schema.org/category> ?cat . }
      }
    }
    UNION
    {
      GRAPH <urn:graph:forum> {
        ?doc <https://schema.org/url> ?url .
        OPTIONAL { ?doc <https://schema.org/title> ?title . }
        OPTIONAL { ?doc <https://schema.org/date> ?date . }
        OPTIONAL { ?doc <https://schema.org/contentRating> ?rating . }
        OPTIONAL { ?doc <https://schema.org/category> ?cat . }
      }
    }
    UNION
    {
      GRAPH <urn:graph:flowslib> {
        ?doc <https://schema.org/url> ?url .
        OPTIONAL { ?doc <https://schema.org/title> ?title . }
        OPTIONAL { ?doc <https://schema.org/date> ?date . }
        OPTIONAL { ?doc <https://schema.org/contentRating> ?rating . }
        OPTIONAL { ?doc <https://schema.org/category> ?cat . }
      }
    }
    UNION
    {
      GRAPH <urn:nrua:app> {
        OPTIONAL { ?doc <https://schema.org/name> ?name . }
      }
    }
  }

  # 6) Site from schema:url (only if ?url is bound)
  BIND(
    IF(BOUND(?url),
      REPLACE(STR(?url), '^https?://([^/]+).*$', '$1'),
      ""
    ) AS ?site
  )

  # 7) Label of the class of the subject
  BIND(
    IF(BOUND(?sClass),
      REPLACE(STR(?sClass), "^.*[#/](.+)$", "$1"),
      "Thing"
    ) AS ?sClassLabel
  )


}
LIMIT 1000

`;

  const { status, json } = await doFetchJson("urdf/query", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sparql })
  });
  if (status !== 200 || !json || !json.ok) throw new Error("Reason query failed: " + JSON.stringify(json));
  return Array.isArray(json.results) ? json.results : [];
}

async function renderReasoning() {
  $reasonList.empty();

  let rows = await loadReasoningResults();
  if (!Array.isArray(rows) || rows.length === 0) {
    $reasonList.append($("<div>").text("No inferred links found."));
    return;
  }

  const byS = new Map();

  for (const r of rows) {
    const s = termValue(r.s);
    const p = termValue(r.p);
    const doc = termValue(r.doc);
    const docType = r.doc && r.doc.type; 
    if (!s || !p || !doc) continue;

    const sClassLabel = termValue(r.sClassLabel) || "";
    const pLabel = termValue(r.pLabel) || "";

    const title  = termValue(r.title)  || "";
    const url    = termValue(r.url)    || "";
    const site   = termValue(r.site)   || ""; // NEW (host extracted from url in SPARQL)
    const date   = termValue(r.date)   || "";
    const rating = termValue(r.rating) || "";
    const cat    = termValue(r.cat)    || "";

    if (!byS.has(s)) byS.set(s, new Map());
    const itemsMap = byS.get(s);

const key = p + "||" + doc;

    let d = itemsMap.get(key);
    if (!d) {
      d = {
        s,
        sClassLabel,
        p,
        pLabel,
        doc,
	docType,
        title,
        url,
        site,
        date,
        rating,
        categories: new Set()
      };
      itemsMap.set(key, d);
    }

    if (!d.sClassLabel && sClassLabel) d.sClassLabel = sClassLabel;
    if (!d.pLabel && pLabel) d.pLabel = pLabel;

    if (!d.title && title) d.title = title;
    if (!d.url && url) d.url = url;
    if (!d.site && site) d.site = site;

    if (!d.date && date) d.date = date;
    if (!d.rating && rating) d.rating = rating;

    if (cat) d.categories.add(cat);

  for (const [s, itemsMap] of byS.entries()) {
    const items = Array.from(itemsMap.values()).sort((a, b) => {

function getQaGroupLabel(template) {
  if (template.groupLabel) return String(template.groupLabel);
  const source = String(template.intentId || template.templateId || "general");
  return formatLabel(source.split(".")[0] || "General");
}

function enrichQaConfig(rawConfig) {
  const config = rawConfig && typeof rawConfig === "object" ? rawConfig : {};
  const intentsById = {};
  (config.intentRegistry || []).forEach(function (intent) {
    if (intent && intent.intentId) intentsById[intent.intentId] = intent;
  });

  const templates = (config.templates || []).map(function (template) {
    const intent = intentsById[template.intentId] || {};
    const execution = template.execution || {};
    return Object.assign({}, template, {
      intentPurpose: intent.purpose || template.intentPurpose || "",
      groupLabel: getQaGroupLabel(template),
      fixedArguments: execution.fixedArguments || template.fixedArguments || {},
      graphHints: execution.graphHints || template.graphHints || [],
      sourceFilters: execution.sourceFilters || template.sourceFilters || []
    });
  });

  const templatesById = {};
  const templateGroups = {};
  templates.forEach(function (template) {
    templatesById[template.templateId] = template;
    const groupLabel = template.groupLabel || "General";
    if (!templateGroups[groupLabel]) templateGroups[groupLabel] = [];
    templateGroups[groupLabel].push(template);
  });

  Object.keys(templateGroups).forEach(function (groupLabel) {
    templateGroups[groupLabel].sort(function (a, b) {
      return String(a.userVisibleLabel || "").localeCompare(String(b.userVisibleLabel || ""), undefined, { sensitivity: "base" });
    });
  });

  return { config: config, templates: templates, templatesById: templatesById, templateGroups: templateGroups, intentsById: intentsById };
}

    $field.append($label, $input, $list);
  } else {
    $input = $("<input>")
      .attr("type", "text")
      .attr("placeholder", definition.semanticType ? formatLabel(definition.semanticType) : formatLabel(definition.name))
      .addClass("red-ui-text")
      .css({ width: "100%", padding: "6px", boxSizing: "border-box" });
    $field.append($label, $input);
  }

  return {
    definition: definition,
    $field: $field,
    getValue: function () { return String($input.val() || ""); },
    setValue: function (value) { $input.val(value == null ? "" : String(value)); },
    refresh: function () {
      const freshOptions = getPickerOptionsForDefinition(definition);
      const listId = $input.attr("list");
      if (listId) {
        const $list = $("#" + listId);
        $list.empty();
        freshOptions.forEach(function (optionValue) {
          $list.append($("<option>").attr("value", optionValue));
        });
      }
    }
  };
}

function createQaEnumControl(definition) {
  const $field = $("<div>").css({ display: "flex", flexDirection: "column", gap: "4px" });
  const labelText = formatLabel(definition.name) + (definition.required ? " *" : "");
  const $label = $("<label>").css({ fontWeight: 600 }).text(labelText);
  const $select = $("<select>")
    .addClass("red-ui-text")
    .css({ width: "100%", padding: "6px", boxSizing: "border-box" });

  $select.append($("<option>").attr("value", "").text(definition.required ? "Choose..." : "(optional)"));
  (definition.allowedValues || []).forEach(function (value) {
    $select.append($("<option>").attr("value", value).text(value));
  });

  $field.append($label, $select);

  return {
    definition: definition,
    $field: $field,
    getValue: function () { return String($select.val() || ""); },
    setValue: function (value) { $select.val(value == null ? "" : String(value)); },
    refresh: function () {}
  };
}

function createQaControl(definition) {
  if (definition.type === "enum") return createQaEnumControl(definition);
  return createQaStringControl(definition);
}

function collectQaParameters(validate) {
  const template = currentQaTemplate();
  const output = {};
  const errors = [];

  if (!template) {
    if (validate) errors.push("Choose a supported question template.");
    return { ok: false, parameters: output, errors: errors };
  }

  (template.parameterDefinitions || []).forEach(function (definition) {
    const control = qaParamControls[definition.name];
    const raw = control ? control.getValue() : "";
    const value = definition.trimWhitespace ? String(raw || "").trim() : String(raw || "");
    const hasValue = value !== "";

    if (validate && definition.required && !hasValue) {
      errors.push('Parameter "' + definition.name + '" is required.');
      return;
    }
    if (validate && hasValue && definition.minLength != null && value.length < definition.minLength) {
      errors.push('Parameter "' + definition.name + '" must contain at least ' + definition.minLength + ' character(s).');
      return;
    }
    if (validate && definition.type === "enum" && hasValue && Array.isArray(definition.allowedValues) && definition.allowedValues.indexOf(value) === -1) {
      errors.push('Parameter "' + definition.name + '" must be one of: ' + definition.allowedValues.join(", ") + '.');
      return;
    }
    if (hasValue) output[definition.name] = value;
  });

  return { ok: errors.length === 0, parameters: output, errors: errors };
}

function buildQaRequest(validate) {
  const template = currentQaTemplate();
  const collected = collectQaParameters(validate);
  return {
    ok: !!template && collected.ok,
    template: template,
    requestBody: template ? {
      templateId: template.templateId,
      parameters: collected.parameters
    } : null,
    errors: (!template ? ["Choose a supported question template."] : []).concat(collected.errors)
  };
}

function renderQaParameters() {
  const template = currentQaTemplate();
  clearQaControls();
  $qaParamsWrap.empty();

  if (!template) {
    $qaParamsWrap.append($("<div>").css({ opacity: 0.8, fontSize: "12px" }).text("Choose a question."));
    return;
  }

  const definitions = template.parameterDefinitions || [];
  if (!definitions.length) {
    $qaParamsWrap.append(
      $("<div>").css({ fontSize: "12px", opacity: 0.85, lineHeight: "1.4" })
        .text("This question does not require additional details.")
    );
    return;
  }

  definitions.forEach(function (definition) {
    const control = createQaControl(definition);
    qaParamControls[definition.name] = control;
    $qaParamsWrap.append(control.$field);
    control.$field.on("input change", function () {
      setQaValidation("");
    });
  });

}

function refreshQaPickers() {
  Object.keys(qaParamControls).forEach(function (key) {
    if (qaParamControls[key] && typeof qaParamControls[key].refresh === "function") {
      qaParamControls[key].refresh();
    }
  });
}

function applyQaTemplateSelection() {
  setQaValidation("");
  renderQaParameters();
}

function applyQaConfig(rawConfig) {
  const enriched = enrichQaConfig(rawConfig);
  qaState.config = enriched.config;
  qaState.templates = enriched.templates;
  qaState.templatesById = enriched.templatesById;
  qaState.templateGroups = enriched.templateGroups;
  qaState.intentsById = enriched.intentsById;
  qaState.loadError = "";
  renderQaTemplateOptions();
  applyQaTemplateSelection();
  setQaStatus("", false);
}

function setQaConfigLoadFailure(message) {
  qaState.loadError = String(message || "Failed to load QA configuration.");
  qaState.config = null;
  qaState.templates = [];
  qaState.templatesById = {};
  qaState.templateGroups = {};
  qaState.intentsById = {};
  clearQaControls();
  $qaTemplateSelect.empty().prop("disabled", true);
  $btnQaRun.prop("disabled", true);
  $qaParamsWrap.empty().append($("<div>").css({ fontSize: "12px", opacity: 0.85, lineHeight: "1.4" }).text(qaState.loadError));
  setQaValidation(qaState.loadError);
  setQaAnswerText(qaState.loadError, true);
  setQaStatus(qaState.loadError, true);
}

async function loadQaConfig(forceReload) {
  if (!forceReload && qaState.config) return qaState.config;
  if (!forceReload && qaState.loadPromise) return qaState.loadPromise;

  setQaStatus("", false);
  qaState.loadPromise = (async function () {
    try {
      const result = await doFetchJson(QA_CONFIG_ENDPOINT, { method: "GET" });
      const payload = result && result.json;
      const isHttpOk = !!result && result.status >= 200 && result.status < 300;
      const isErrorPayload = !!payload && typeof payload === "object" && payload.ok === false;
      if (!isHttpOk) {
        throw new Error(payload && payload.error ? String(payload.error) : ("HTTP " + result.status));
      }
      if (isErrorPayload) {
        throw new Error(payload.error ? String(payload.error) : "Invalid QA configuration response.");
      }
      applyQaConfig(payload);
      appendLog("HTTP " + result.status + " GET /urdf/qa/config");
      return qaState.config;
    } catch (e) {
      const message = "Failed to load QA configuration: " + String(e);
      appendLog("ERROR loading /urdf/qa/config: " + String(e));
      setQaConfigLoadFailure(message);
      throw e;
    } finally {
      qaState.loadPromise = null;
    }
  })();

  return qaState.loadPromise;
}

async function ensureQaConfigLoaded() {
  if (qaState.config) return qaState.config;
  return loadQaConfig(false);
}

    /*
      HTTP helper:
      Node-RED may be hosted under a non-root admin path (RED.settings.httpAdminRoot).
      doFetchJson() builds the correct URL and enforces a JSON response contract.
    */
async function doFetchJson(path, options) {
  const adminRoot = (RED.settings.httpAdminRoot || "").replace(/\/$/, "");

  let url = path;
  if (!/^https?:\/\//i.test(path) && !path.startsWith("/")) {
    url = adminRoot + "/" + path;
  }

  const r = await fetch(url, options);

  let json;
  try {
    json = await r.json();
  } catch (e) {
    const text = await r.text().catch(() => "");
    throw new Error(`Expected JSON from ${url} but got: ${text.slice(0, 200)}`);
  }

  return { status: r.status, json };
}


async function doFetchText(path, options) {
  const adminRoot = (RED.settings.httpAdminRoot || "").replace(/\/$/, "");

  let url = path;
  if (!/^https?:\/\//i.test(path) && !path.startsWith("/")) {
    url = adminRoot + "/" + path;
  }

  const r = await fetch(url, options);
  const text = await r.text();
  return { status: r.status, text: text, url: url };
}

      appendLog("ERROR export: HTTP " + r.status);
      return;
    }

    const cd = r.headers.get("Content-Disposition") || "";
    let filename = "urdf-export.jsonld";
    const m = /filename="([^"]+)"/.exec(cd);
    if (m && m[1]) filename = m[1];

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);

    setResponse({ ok: true, filename, bytes: blob.size, gid: gid || "(default)" });
    appendLog("Downloaded export: " + filename);
  } catch (e) {
    setResponse({ ok: false, error: String(e) });
    appendLog("ERROR export: " + String(e));

    function handlePush(msg) {
      if (!msg) return;

      if (msg.type === "metrics" && msg.cycleId && msg.kind && !metricsState.paused) {
        upsertCycleEvent(msg);
        renderCyclesList();
        return;
      }

      if (msg.type && msg.type == "appUpdate") {
        scheduleReasonRefresh(msg);
      }
    }

return { appendLog, setResponse, scheduleReasonRefresh, handlePush };
  }

  
  /*
    Plugin lifecycle:
    Node-RED calls onadd() once when the editor loads. We create the sidebar, then subscribe
    to runtime push events (RED.comms). When events arrive, we log them and optionally refresh
    the Reason view after application updates.
  */
RED.plugins.registerPlugin("urdf-editor", {
    onadd: function () {
      const ui = createSidebar();
      ui.appendLog("Sidebar loaded. Subscribing to " + TOPIC + "...");

      if (!RED.comms || typeof RED.comms.subscribe !== "function") {
        ui.appendLog("ERROR: RED.comms.subscribe is not available.");
        return;
      }

      RED.comms.subscribe(TOPIC, function (a, b) {
        const msg =
          (b !== undefined) ? b :
          (a && typeof a === "object") ? a :
          null;

        if (!msg) return;

        ui.appendLog(JSON.stringify(msg));

        if (msg.response) {
          ui.setResponse(msg.response);
        }

        ui.handlePush(msg);
      });
    }
  });
})();
